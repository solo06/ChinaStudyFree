name: Docker Hub 镜像发布

# 用途：用 docker/Dockerfile 构建多架构镜像（linux/amd64 + linux/arm64）并推送到 Docker Hub。
# 需要在仓库 Secrets 里配置：
#   DOCKERHUB_USERNAME  Docker Hub 用户名
#   DOCKERHUB_TOKEN     Docker Hub 访问令牌（Read & Write）
#
# 触发：
#   - 手动 workflow_dispatch
#   - 推送 docker-v* 标签（如 docker-v0.2.0）→ 同时打上 0.2.0 标签
#   - 推到 main 且改动涉及 docker/ 或应用代码 → 推 latest + sha-短哈希
#
# latest 策略：推 docker-vX.Y.Z 时，只要 X.Y.Z 不小于已发布的最高版本，latest 就跟着走；
#   补推旧版本 tag（如 0.4.1 出现在 0.5.0 之后）不会把 latest 回退。
#
# 架构：x64 原生构建，arm64 走 QEMU 模拟（GitHub 的 arm64 Runner 排队不可控，
#   单次约 15~30 分钟，超时已放宽到 120 分钟）。产物是一份 manifest list，
#   amd64 / arm64 机器 docker pull 时自动取对应架构。
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "目标平台（留空=amd64+arm64；只出单架构可填 linux/amd64）"
        required: false
        default: ""
  push:
    tags:
      - "docker-v*"
    branches:
      - main
    paths:
      - "docker/**"
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dockerhub.yml"

permissions:
  contents: read
  # 推 GHCR 必须；缺了会在 push 阶段被拒
  packages: write

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: chinastudyfree

jobs:
  publish:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 计算目标平台
        run: |
          set -euo pipefail
          P="${{ inputs.platforms }}"
          [ -n "$P" ] || P="linux/amd64,linux/arm64"
          echo "PLATFORMS=$P" >> "$GITHUB_ENV"
          echo "平台：$P"

      - name: 安装 QEMU（arm64 模拟）
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest 只跟「不小于已发布最高版本」的 tag 走：
      # 推 docker-v0.6.0 → latest 前移；补推 docker-v0.4.1 → latest 保持不变（防回退）。
      - name: 判断本次是否推进 latest
        id: latest
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
            echo "LATEST_OK=1" >> "$GITHUB_ENV"
            echo "非 tag 触发（main / 手动）→ 更新 latest"
            exit 0
          fi
          NEW="${GITHUB_REF_NAME#docker-v}"
          if ! printf '%s' "$NEW" | grep -qE '^[0-9]+(\.[0-9]+)*$'; then
            echo "LATEST_OK=0" >> "$GITHUB_ENV"
            echo "tag $GITHUB_REF_NAME 不是版本号（应为 docker-vX.Y.Z）→ 不动 latest"
            exit 0
          fi
          API="https://hub.docker.com/v2/repositories/${DH_USER}/${IMAGE_NAME}/tags?page_size=100"
          PUBLISHED="$(curl -fsS --max-time 20 "$API" 2>/dev/null \
            | python3 -c 'import sys,json; print("\n".join(t["name"] for t in json.load(sys.stdin).get("results",[])))' 2>/dev/null \
            | grep -E '^[0-9]+(\.[0-9]+)*$' || true)"
          MAX="$(printf '%s\n' "$PUBLISHED" | sort -V | tail -n1)"
          if [ -z "$MAX" ]; then
            echo "LATEST_OK=1" >> "$GITHUB_ENV"
            echo "还没有任何版本 tag → 本次 $NEW 设为 latest"
            exit 0
          fi
          HIGHEST="$(printf '%s\n%s\n' "$NEW" "$MAX" | sort -V | tail -n1)"
          if [ "$HIGHEST" = "$NEW" ]; then
            echo "LATEST_OK=1" >> "$GITHUB_ENV"
            echo "本次 $NEW >= 已发布最高版 $MAX → 推进 latest"
          else
            echo "LATEST_OK=0" >> "$GITHUB_ENV"
            echo "本次 $NEW < 已发布最高版 $MAX → latest 保持不动（防回退）"
          fi

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          # 两行 = 一次构建产出两套 tag；GHCR 地址必须全小写
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          # latest=false 必写：关掉 metadata-action 的 latest=auto，latest 完全由上面的
          # 「判断本次是否推进 latest」决定（tag 前进、旧 tag 不回退）。
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ env.LATEST_OK == '1' }}
            type=sha,format=short
            type=match,pattern=docker-v(.*),group=1

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 固定 scope：否则每个 ref 一份缓存，tag 触发永远冷启动
          cache-from: type=gha,scope=csf-image
          cache-to: type=gha,mode=max,scope=csf-image

      - name: 校验两个 registry 的 manifest 架构
        run: |
          set -euo pipefail
          printf '%s\n' "${{ steps.meta.outputs.tags }}" | while read -r T; do
            [ -n "$T" ] || continue
            echo "=== $T ==="
            docker buildx imagetools inspect "$T" | sed -n '1,20p'
          done

      - name: 冒烟测试（拉取刚推送的镜像，跑 /api/health）
        run: |
          set -euo pipefail
          TAG="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)"
          echo "测试镜像：$TAG"
          docker pull --platform linux/amd64 "$TAG"
          docker run -d --name csf-smoke --platform linux/amd64 -p 18787:8787 "$TAG"
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18787/api/health; then ok=1; break; fi
            sleep 3
          done
          echo
          docker logs --tail 80 csf-smoke || true
          docker rm -f csf-smoke >/dev/null || true
          [ "$ok" = "1" ] || { echo "健康检查失败"; exit 1; }
          echo "冒烟测试通过"

      - name: 输出镜像摘要
        run: |
          {
            echo "### 已发布镜像"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- 平台: \`$PLATFORMS\`"
          } >> "$GITHUB_STEP_SUMMARY"
