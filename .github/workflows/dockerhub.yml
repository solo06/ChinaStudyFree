name: Docker Hub 镜像发布

# 用途：用 docker/Dockerfile 构建镜像并推送到 Docker Hub（默认 linux/amd64）。
# 需要在仓库 Settings → Secrets and variables → Actions 里配置：
#   DOCKERHUB_USERNAME  Docker Hub 用户名
#   DOCKERHUB_TOKEN     Docker Hub 访问令牌（Read & Write，不要用登录密码）
#
# 触发：
#   - 手动 workflow_dispatch（可勾选同时构建 arm64）
#   - 推送 docker-v* 标签（如 docker-v0.1.0）→ 同时打上 0.1.0 标签
#   - 推到 main 且改动涉及 docker/ 或应用代码 → 推 latest + sha-短哈希
#
# 产物：<用户名>/chinastudyfree:latest / :<版本> / :sha-xxxxxxx
on:
  workflow_dispatch:
    inputs:
      arm64:
        description: "同时构建 linux/arm64（耗时明显更长）"
        type: boolean
        default: false
  push:
    tags:
      - "docker-v*"
    branches:
      - main
    paths:
      - "docker/**"
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dockerhub.yml"

permissions:
  contents: read

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: chinastudyfree

jobs:
  publish:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 计算目标平台
        id: platform
        run: |
          if [ "${{ inputs.arm64 }}" = "true" ]; then
            echo "PLATFORMS=linux/amd64,linux/arm64" >> "$GITHUB_ENV"
          else
            echo "PLATFORMS=linux/amd64" >> "$GITHUB_ENV"
          fi
          echo "平台：$PLATFORMS"

      - name: 安装 QEMU（多架构时需要）
        if: inputs.arm64
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=match,pattern=docker-v(.*),group=1

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟测试（拉取刚推送的镜像，跑 /api/health）
        run: |
          set -euo pipefail
          TAG="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)"
          echo "测试镜像：$TAG"
          docker pull "$TAG"
          docker run -d --name csf-smoke -p 18787:8787 "$TAG"
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18787/api/health; then ok=1; break; fi
            sleep 3
          done
          echo
          docker logs --tail 80 csf-smoke || true
          docker rm -f csf-smoke >/dev/null || true
          [ "$ok" = "1" ] || { echo "健康检查失败"; exit 1; }
          echo "冒烟测试通过"

      - name: 输出镜像摘要
        run: |
          echo "### 已发布镜像" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "- digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 平台: \`$PLATFORMS\`" >> "$GITHUB_STEP_SUMMARY"
