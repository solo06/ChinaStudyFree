name: Docker Hub 镜像发布

# 用途：用 docker/Dockerfile 构建多架构镜像（linux/amd64 + linux/arm64）并推送到 Docker Hub。
# 需要在仓库 Secrets 里配置：
#   DOCKERHUB_USERNAME  Docker Hub 用户名
#   DOCKERHUB_TOKEN     Docker Hub 访问令牌（Read & Write）
#
# 触发：
#   - 手动 workflow_dispatch
#   - 推送 docker-v* 标签（如 docker-v0.2.0）→ 同时打上 0.2.0 标签
#   - 推到 main 且改动涉及 docker/ 或应用代码 → 推 latest + sha-短哈希
#
# 架构：x64 原生构建，arm64 走 QEMU 模拟（GitHub 的 arm64 Runner 排队不可控，
#   单次约 15~30 分钟，超时已放宽到 120 分钟）。产物是一份 manifest list，
#   amd64 / arm64 机器 docker pull 时自动取对应架构。
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "目标平台（留空=amd64+arm64；只出单架构可填 linux/amd64）"
        required: false
        default: ""
  push:
    tags:
      - "docker-v*"
    branches:
      - main
    paths:
      - "docker/**"
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dockerhub.yml"

permissions:
  contents: read

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: chinastudyfree

jobs:
  publish:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 计算目标平台
        run: |
          set -euo pipefail
          P="${{ inputs.platforms }}"
          [ -n "$P" ] || P="linux/amd64,linux/arm64"
          echo "PLATFORMS=$P" >> "$GITHUB_ENV"
          echo "平台：$P"

      - name: 安装 QEMU（arm64 模拟）
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          # latest=false 必写：否则 metadata-action 的 latest=auto 在推任何 tag 时也会打上
          # latest，以后补推一个旧版本 tag 会把 latest 悄悄回退成旧代码。
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=match,pattern=docker-v(.*),group=1

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 校验 manifest 架构
        run: |
          set -euo pipefail
          TAG="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)"
          docker buildx imagetools inspect "$TAG" | sed -n '1,40p'

      - name: 冒烟测试（拉取刚推送的镜像，跑 /api/health）
        run: |
          set -euo pipefail
          TAG="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)"
          echo "测试镜像：$TAG"
          docker pull --platform linux/amd64 "$TAG"
          docker run -d --name csf-smoke --platform linux/amd64 -p 18787:8787 "$TAG"
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18787/api/health; then ok=1; break; fi
            sleep 3
          done
          echo
          docker logs --tail 80 csf-smoke || true
          docker rm -f csf-smoke >/dev/null || true
          [ "$ok" = "1" ] || { echo "健康检查失败"; exit 1; }
          echo "冒烟测试通过"

      - name: 输出镜像摘要
        run: |
          {
            echo "### 已发布镜像"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- 平台: \`$PLATFORMS\`"
          } >> "$GITHUB_STEP_SUMMARY"
