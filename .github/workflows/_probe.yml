name: probe runners
on:
  push:
    tags: ['probe-v*']
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - run: uname -m && sw_vers && xcodebuild -version
