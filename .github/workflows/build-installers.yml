name: 构建各平台安装包

# 用途：在 GitHub Actions 上产出本机无法构建的安装包
#   - iOS 未签名 IPA（需 macOS + Xcode，Windows 无法归档）
#   - Linux 桌面版 AppImage / deb（需 Linux 工具链）
#   - Docker 镜像 tar（本机无 Docker 守护进程）
#   - 同时可复现 Windows 安装包（NSIS/MSI）与安卓 APK/AAB
#
# 触发：手动（workflow_dispatch）或推送 tag（v*）
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  NODE_VERSION: "22"

jobs:
  # ───────────────────────── 数据与静态站（各 Job 共用的前置产物）─────────────────────────
  web:
    name: Web 静态站 + 前端数据
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: 生成前端数据（output/ → public/data）
        run: npm run build:data
      - name: 抓取教材目录（ChinaTextbook）
        run: npm run sync:textbooks
        continue-on-error: true
      - name: 构建静态站
        run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: apps/web/out
          retention-days: 7

  # ───────────────────────── Windows 桌面安装包（NSIS + MSI）─────────────────────────
  desktop-windows:
    name: Windows 安装包（NSIS/MSI）
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          name: web-out
          path: apps/web/out
      - run: npm ci --ignore-scripts
      - run: npm run build:data
      - name: 编译 AI 后端
        run: npm run build:server
      - name: 内置 Node 运行时（供本地 AI 服务）
        shell: bash
        run: |
          mkdir -p apps/desktop/src-tauri/bin
          cp "$(which node)" apps/desktop/src-tauri/bin/node.exe
      - name: 构建桌面版 + 安装包
        working-directory: apps/desktop
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

  # ───────────────────────── Linux 桌面安装包（AppImage / deb）─────────────────────────
  desktop-linux:
    name: Linux 安装包（AppImage/deb）
    needs: web
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux 依赖（WebKitGTK / AppIndicator）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/download-artifact@v4
        with:
          name: web-out
          path: apps/web/out
      - run: npm ci --ignore-scripts
      - run: npm run build:data
      - run: npm run build:server
      - name: 构建 Linux 桌面版
        working-directory: apps/desktop
        run: npx tauri build --bundles appimage,deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 30

  # ───────────────────────── 安卓（发布签名 APK + AAB）─────────────────────────
  android:
    name: 安卓 APK（纯原生工程）
    needs: web
    runs-on: ubuntu-latest
    # 在仓库 Secrets 里配置 ANDROID_KEYSTORE_BASE64 / ANDROID_STORE_PASSWORD /
    # ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD 即用你自己的发布密钥签名；
    # 未配置时 build.gradle 会回退到 debug 签名（能装，不适合上架）。
    env:
      # 作业级变量：step 的 if 只能看到 job/workflow 级 env，看不到本 step 自己的 env
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: 补齐 Android SDK 组件（platforms;android-34 / build-tools;34.0.0）
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMAN="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"
          need=()
          [ -d "$SDK/platforms/android-34" ] || need+=("platforms;android-34")
          [ -d "$SDK/build-tools/34.0.0" ] || need+=("build-tools;34.0.0")
          if [ ${#need[@]} -gt 0 ]; then
            yes | "$SDKMAN" --licenses >/dev/null 2>&1 || true
            "$SDKMAN" "${need[@]}" >/dev/null
          fi
      - run: npm ci --ignore-scripts
      - name: 生成题库数据
        run: npm run build:data
      - name: 生成原生端资源
        run: node apps/native-android/prepare-data.mjs
      - name: 写入发布签名（可选）
        working-directory: apps/native-android
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/release.jks
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
      - name: 构建 APK
        working-directory: apps/native-android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-installers
          path: apps/native-android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  # ───────────────────────── Docker 镜像（tar 归档）─────────────────────────
  docker:
    name: Docker 镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: docker build -f docker/Dockerfile -t china-study-free:latest .
      - name: 导出镜像 tar
        run: docker save china-study-free:latest -o china-study-free-docker.tar
      - name: 冒烟测试
        run: |
          docker run -d --name cstf -p 8787:8787 china-study-free:latest
          sleep 8
          curl -fsS http://127.0.0.1:8787/api/health
          docker rm -f cstf
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image-tar
          path: china-study-free-docker.tar
          retention-days: 30
